<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perdón, mi amorcito</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --soft: #cbd5e1;
            --accent: #f472b6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1rem;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, #1e293b, var(--bg));
            color: var(--text);
        }

        .card {
            width: min(700px, 95vw);
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(244, 114, 182, 0.3);
            border-radius: 18px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin-top: 0;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            color: #fda4af;
        }

        p {
            margin: 0.9rem 0;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.7;
            color: var(--soft);
        }

        .strong {
            color: var(--text);
            font-weight: 700;
        }

        .heart {
            margin-top: 1rem;
            font-size: 2rem;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Perdón, mi amorcito 💖</h1>
        <p>Perdóname por hacerte enojar y por estar de malas.</p>
        <p>Sé que te mereces mi mejor versión, más paciencia y más cariño.</p>
        <p class="strong">Nada de eso cambia lo que siento por ti.</p>
        <p class="strong">No dejo de amarte ni un poquito.</p>
        <p>Te amo muchísimo y quiero hacer las cosas mejor por nosotros.</p>
        <div class="heart">❤</div>
    </main>
</body>
</html>
